name: Update closing prices

on:
  schedule:
    # 22:30 UTC on weekdays = 18:30 in Montréal in summer (EDT), 17:30 in winter (EST).
    # Both are after the 16:00 close. GitHub can start scheduled runs a little late.
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write   # reminders are posted as a GitHub issue (GitHub emails the owner)

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Fetch closes and write to Supabase
        run: python scripts/update_prices.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Reminders (private values to update, renewals, RRSP deadline)
        if: always()
        continue-on-error: true
        run: python scripts/reminders.py
        working-directory: .
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
