name: Update prices

on:
  schedule:
    # 22:30 UTC on weekdays = 18:30 in Montréal in summer (EDT), 17:30 in winter (EST).
    # Both are after the 16:00 close. GitHub can start scheduled runs a little late.
    - cron: "30 22 * * 1-5"
    # Every 30 minutes on weekdays, 13:00–21:59 UTC; the first step skips the runs outside
    # 9:30–16:15 in Toronto (the hours shift with daylight saving). Off the hour: GitHub is busiest at :00.
    - cron: "7,37 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write   # reminders are posted as a GitHub issue (GitHub emails the owner)

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Choose the mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "7,37 13-21 * * 1-5" ]; then
            t=$(TZ=America/Toronto date +%H%M)
            if (( 10#$t < 930 || 10#$t > 1615 )); then
              echo "Markets closed ($t in Toronto): nothing to do."
              echo "run=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mode=intraday" >> "$GITHUB_OUTPUT"
          fi
          echo "run=yes" >> "$GITHUB_OUTPUT"
      - if: steps.mode.outputs.run == 'yes'
        uses: actions/checkout@v4
      - if: steps.mode.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - if: steps.mode.outputs.run == 'yes'
        run: pip install -r scripts/requirements.txt
      - name: Fetch prices and write to Supabase
        if: steps.mode.outputs.run == 'yes'
        run: python scripts/update_prices.py
        env:
          PRICE_MODE: ${{ steps.mode.outputs.mode }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Reminders (private values to update, renewals, RRSP deadline)
        if: always() && steps.mode.outputs.run == 'yes' && steps.mode.outputs.mode != 'intraday'
        continue-on-error: true
        run: python scripts/reminders.py
        working-directory: .
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
